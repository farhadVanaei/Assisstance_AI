services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # After first start, pull models:
    #   docker compose exec ollama ollama pull llama3.2
    #   docker compose exec ollama ollama pull nomic-embed-text
    restart: unless-stopped

  javad:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      JAVAD_OLLAMA_MODEL: ${JAVAD_OLLAMA_MODEL:-llama3.2}
      JAVAD_OLLAMA_EMBED_MODEL: ${JAVAD_OLLAMA_EMBED_MODEL:-nomic-embed-text}
      JAVAD_DATA_DIR: /data
      JAVAD_SQLITE_PATH: /data/javad.db
      JAVAD_CHROMA_PATH: /data/chroma
      JAVAD_DEFAULT_LANGUAGE: ${JAVAD_DEFAULT_LANGUAGE:-fa}
      JAVAD_API_KEY: ${JAVAD_API_KEY:-}
      JAVAD_CORS_ORIGINS: ${JAVAD_CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      JAVAD_CORS_ALLOW_ALL: ${JAVAD_CORS_ALLOW_ALL:-false}
    volumes:
      - javad_data:/data
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  javad_data:
